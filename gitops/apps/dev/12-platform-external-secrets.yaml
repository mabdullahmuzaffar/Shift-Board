apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.12.1
    helm:
      values: |
        installCRDs: true
        replicaCount: 2
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            # Replaced by the pipeline with the real client id from the
            # Terraform output. ESO uses workload identity to read Key Vault,
            # so there is no Key Vault credential stored in the cluster.
            azure.workload.identity/client-id: "REPLACED_BY_PIPELINE"
        podLabels:
          azure.workload.identity/use: "true"
        webhook:
          replicaCount: 2
        certController:
          replicaCount: 1
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
