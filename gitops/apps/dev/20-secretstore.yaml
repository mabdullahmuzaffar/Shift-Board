# Wave 1: needs External Secrets Operator running.
#
# A ClusterSecretStore rather than a namespaced SecretStore so multiple
# namespaces can reference the same vault without duplicating configuration.
# ESO authenticates with workload identity, so this object contains no
# credential -- only the vault URL and tenant.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "REPLACED_BY_PIPELINE"   # https://kv-....vault.azure.net/
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
