apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      values: |
        # Installs its own CRDs. Argo CD needs ServerSideApply for these --
        # the cert-manager CRDs exceed the annotation size limit that
        # client-side apply uses to store last-applied-configuration.
        crds:
          enabled: true
          keep: true
        replicaCount: 2
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
