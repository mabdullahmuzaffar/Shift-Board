{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shift-api.serviceAccountName" . }}
  labels:
    {{- include "shift-api.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.clientId .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.serviceAccount.clientId }}
    # Binds this service account to a specific Azure managed identity. The
    # federated credential in infra/modules/identity trusts exactly
    # system:serviceaccount:<namespace>:<this name>, so renaming either side
    # breaks token exchange with AADSTS700213.
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# Nothing in this pod calls the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
{{- end }}
