{{- if .Values.externalSecrets.enabled }}
# Projects Key Vault secrets into a Kubernetes Secret. ESO authenticates with
# its own workload identity, so no Key Vault credential lives in the cluster.
#
# Only secrets that cannot be replaced by a managed identity belong here.
# Database and Service Bus access deliberately do not appear.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "shift-api.fullname" . }}
  labels:
    {{- include "shift-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "shift-api.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "shift-api.labels" . | nindent 10 }}
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .version }}
        version: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
