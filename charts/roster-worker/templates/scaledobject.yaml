{{- if .Values.keda.enabled }}
# KEDA scales the worker on Service Bus queue depth rather than CPU.
#
# Why this matters: a consumer blocked on a slow database shows near-zero CPU
# while the backlog grows without bound, so an HPA on CPU would scale DOWN
# exactly when more capacity is needed. Queue depth is the only honest signal
# for a queue consumer.
#
# KEDA can also scale to zero, but minReplicaCount is 1 here: a cold start
# has to establish an AMQP link and an Entra token, which would add seconds
# of latency to the first event after an idle period.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "roster-worker.fullname" . }}
  labels:
    {{- include "roster-worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "roster-worker.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Slow scale-down so a bursty queue does not thrash replicas.
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: {{ .Values.config.serviceBus.queue | quote }}
        namespace: {{ .Values.config.serviceBus.namespace | quote }}
        messageCount: {{ .Values.keda.messageCount | quote }}
        # activeMessageCount excludes dead letters, so a full DLQ does not
        # scale the worker up forever against messages it cannot process.
        activationMessageCount: "1"
      authenticationRef:
        name: {{ .Values.keda.triggerAuthenticationName }}
{{- end }}
