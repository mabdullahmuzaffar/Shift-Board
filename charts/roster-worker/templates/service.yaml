# Exists purely so the ServiceMonitor has something to select. No traffic
# routes through it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "roster-worker.fullname" . }}
  labels:
    {{- include "roster-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None      # headless: no need for a virtual IP
  ports:
    - name: metrics
      port: {{ .Values.config.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "roster-worker.selectorLabels" . | nindent 4 }}
