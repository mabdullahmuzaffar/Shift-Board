apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "roster-worker.fullname" . }}
  labels:
    {{- include "roster-worker.labels" . | nindent 4 }}
data:
  SHIFTBOARD_ENVIRONMENT: {{ .Values.config.environment | quote }}
  SHIFTBOARD_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SHIFTBOARD_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  SHIFTBOARD_METRICS_PORT: {{ .Values.config.metricsPort | quote }}

  SHIFTBOARD_DB_HOST: {{ required "config.database.host is required" .Values.config.database.host | quote }}
  SHIFTBOARD_DB_PORT: {{ .Values.config.database.port | quote }}
  SHIFTBOARD_DB_NAME: {{ .Values.config.database.name | quote }}
  SHIFTBOARD_DB_USE_MANAGED_IDENTITY: {{ .Values.config.database.useManagedIdentity | quote }}

  SHIFTBOARD_SERVICEBUS_NAMESPACE: {{ required "config.serviceBus.namespace is required" .Values.config.serviceBus.namespace | quote }}
  SHIFTBOARD_SERVICEBUS_QUEUE: {{ .Values.config.serviceBus.queue | quote }}

  SHIFTBOARD_PREFETCH_COUNT: {{ .Values.config.consumer.prefetchCount | quote }}
  SHIFTBOARD_MAX_WAIT_SECONDS: {{ .Values.config.consumer.maxWaitSeconds | quote }}
  SHIFTBOARD_MAX_MESSAGE_BATCH: {{ .Values.config.consumer.maxMessageBatch | quote }}
