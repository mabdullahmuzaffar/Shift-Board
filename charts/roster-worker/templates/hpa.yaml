{{- if and .Values.autoscaling.enabled (not .Values.keda.enabled) }}
# CPU-based fallback, used only when KEDA is not installed. See the comment
# in values.yaml -- this is the less correct option for a queue consumer and
# exists so the chart still scales in a cluster without KEDA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "roster-worker.fullname" . }}
  labels:
    {{- include "roster-worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "roster-worker.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
