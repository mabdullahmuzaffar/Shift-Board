{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "roster-worker.fullname" . }}
  labels:
    {{- include "roster-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "roster-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Metrics scraping only. Nothing calls this pod for work -- it pulls from
    # the queue.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: metrics
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
              - 10.0.0.0/8
      ports:
        {{- range .Values.networkPolicy.allowedEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        {{- range .Values.networkPolicy.allowedEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
